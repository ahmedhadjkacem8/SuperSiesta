# ============================================================
# SuperSiesta — Docker Compose (App + Frontend only)
# Connexion à DATABASE LOCALE (host.docker.internal)
# ============================================================

services:

  # 1. BACKEND (Laravel)
  api:
    build:
      context:    ./SuperSiestaApi
      dockerfile: Dockerfile
      target:     production
    container_name: supersiesta_api
    restart: unless-stopped
    env_file: ./SuperSiestaApi/.env.docker
    # Permet de joindre MySQL sur Windows si besoin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Volume partagé pour les fichiers uploadés (storage/app/public uniquement)
      # ⚠️ Ne PAS monter tout storage/ avec un volume nommé : ça écrase les fichiers
      - api_storage_public:/var/www/html/storage/app/public
      - api_logs:/var/www/html/storage/logs


  # 2. NGINX FOR API
  api-nginx:
    image: nginx:alpine
    container_name: supersiesta_api_nginx
    restart: unless-stopped
    volumes:
      - ./SuperSiestaApi/docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./SuperSiestaApi/public:/var/www/html/public:ro
      # ✅ Même volume partagé que le container api → Nginx voit les mêmes fichiers uploadés
      - api_storage_public:/var/www/html/storage/app/public:ro
    ports:
      - "${API_PORT:-8000}:80"
    depends_on:
      - api

  # 3. FRONTEND (React)
  front:
    build:
      context:    ./SuperSiestaFront
      dockerfile: Dockerfile
      target:     production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: supersiesta_front
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api-nginx

  # 3.5. CERTBOT (SSL)
  certbot:
    image: certbot/certbot
    container_name: supersiesta_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Commande pour le renouvellement automatique (tourne toutes les 12h)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"


  # 4. JENKINS
  jenkins:
    build:
      context: .
      dockerfile: ./docker/jenkins/Dockerfile
    container_name: supersiesta_jenkins
    restart: unless-stopped
    ports:
      - "${JENKINS_PORT:-8080}:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  # 5. DATABASE (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: supersiesta_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-SuperSiesta_Root_2024!}
      MYSQL_DATABASE: ${DB_DATABASE:-SuperSiestaDB}
      MYSQL_USER: ${DB_USERNAME:-siesta_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-AzAwZZ12SaHz}
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: supersiesta_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-SuperSiesta_Root_2024!}
    depends_on:
      - db

volumes:
  api_storage_public:   # volume partagé api ↔ nginx pour les uploads
  api_logs:
  jenkins_home:
  db_data:              # volume persistant pour MySQL

