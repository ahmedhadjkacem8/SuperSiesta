# ==============================================================
# Détection des crawlers réseaux sociaux / moteurs de recherche
# Doit être au niveau http (en dehors des blocs server{})
# ==============================================================
map $http_user_agent $is_seo_bot {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|TelegramBot|Slackbot|Discordbot|Pinterest|SkypeUriPreview|vkShare|redditbot|Googlebot|bingbot|Applebot|W3C_Validator) 1;
}

server {
    listen 80;
    server_name siestaofficiel.com www.siestaofficiel.com demo.siestaofficiel.com www.demo.siestaofficiel.com _;

    # ---- Certbot Acme Challenge ----
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Redirection HTTP vers HTTPS (A DECOMMENTER SEULEMENT APRÈS GENERATION CERTIFICAT)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================
# BLOC HTTPS (A DECOMMENTER APRÈS AVOIR GÉNÉRÉ LE CERTIFICAT)
# ==============================================================
server {
    listen 443 ssl;
    server_name siestaofficiel.com www.siestaofficiel.com demo.siestaofficiel.com www.demo.siestaofficiel.com;

    ssl_certificate /etc/letsencrypt/live/demo.siestaofficiel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.siestaofficiel.com/privkey.pem;

    # Options SSL de base recommandées
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Pas de limite de taille pour les uploads (vidéos, images)
    client_max_body_size 0;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location = /sitemap.xml {
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|eot|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /api {
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Permettre les gros uploads (vidéos)
        client_max_body_size    0;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_connect_timeout   60s;
    }

    location ^~ /sanctum {
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /storage {
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads {
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================================
    # SEO Render — proxy conditionnel vers Laravel pour les bots
    # (réseaux sociaux, moteurs de recherche). Les vrais visiteurs
    # continuent de recevoir le SPA React via try_files.
    #
    # NOTE TECHNIQUE : "proxy_set_header" n'est PAS autorisé à
    # l'intérieur d'un bloc if{} en nginx (directive non définie
    # dans le contexte NGX_HTTP_LIF_CONF). On utilise donc le
    # pattern "return <code interne> + error_page => location
    # nommée" pour déporter le proxy_pass hors du if.
    #
    # IMPORTANT : ces blocs doivent rester AVANT le location / final.
    # ==========================================================
    location ~ ^/(produit|blog)/[^/]+/?$ {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location ~ ^/boutique/[^/]+/?$ {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /boutique {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /showrooms {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /a-propos {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /contact {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /blog {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location = /faq {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    # Code interne "sentinelle" (jamais vu par le client) qui
    # redirige en interne vers le bloc de proxy nommé ci-dessous.
    error_page 418 = @seo_proxy;

    location @seo_proxy {
        internal;
        proxy_pass http://api-nginx:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Homepage — exact match has higher priority than prefix location /
    location = / {
        if ($is_seo_bot) {
            return 418;
        }
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}